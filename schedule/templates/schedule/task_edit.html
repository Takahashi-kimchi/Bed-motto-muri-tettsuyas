{% extends 'base.html' %}

{% block title %}タスクの編集{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <div style="margin-bottom: 20px;">
        <a href="javascript:history.back()" style="text-decoration: none; color: var(--accent-color); font-weight: bold;">← 戻る</a>
    </div>

    <div class="card">
        <h1 style="margin-top: 0; font-size: 1.5em; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 20px;">
            ✏️ タスクの編集
        </h1>
        
        <form method="post">
            {% csrf_token %}
            
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: bold; margin-bottom: 8px; color: var(--text-sub);">タスク名</label>
                {{ form.title }}
            </div>
            
            <div style="margin-bottom: 25px;">
                <label style="display: block; font-weight: bold; margin-bottom: 8px; color: var(--text-sub);">期限</label>
                {{ form.due_date }}
            </div>

            <div style="display: flex; gap: 10px;">
                <button type="submit" style="background: var(--accent-color); color: white; border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1;">
                    保存する
                </button>
                <a href="javascript:history.back()" style="display: block; text-align: center; text-decoration: none; background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-color); padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer;">
                    キャンセル
                </a>
            </div>
        </form>
    </div>
</div>

<style>
    /* フォームパーツのデザイン */
    input[type="text"], input[type="date"] {
        width: 100%;
        padding: 12px;
        border-radius: 6px;
        border: 1px solid var(--border-color);
        background: var(--bg-color);
        color: var(--text-main);
        box-sizing: border-box;
        font-size: 1em;
    }
</style>
{% endblock %}
